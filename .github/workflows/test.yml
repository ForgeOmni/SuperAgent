name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            allow_advisories: 'true'
          - php: '8.2'
            allow_advisories: 'true'
          - php: '8.3'
          - php: '8.4'
          - php: '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, json, curl
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      # `composer update`, not `install`: the committed lock pins one dev set,
      # and no single set spans PHP 8.1 through 8.5 (PHPUnit 12 needs >= 8.3,
      # 8.1 can only have PHPUnit 10). Each leg resolves what its PHP allows.
      - name: Install dependencies
        run: |
          if [ "${{ matrix.allow_advisories }}" = "true" ]; then
            # On 8.1 / 8.2 the dev set resolves to a Laravel 10 / 11 era
            # Testbench, and those framework majors are past security support:
            # every release carries an advisory, which Composer refuses to
            # install by default, so nothing is installable. This container
            # ships nothing — the alternative is to stop testing the PHP
            # versions this package supports.
            composer config --no-plugins policy.advisories.block false
          fi
          composer update --prefer-dist --no-progress --no-interaction

      # Duplication gate (deepseek-harness-style): whole-file/large-block
      # copy-paste fails the build. `composer run duplication:report` is the
      # finer-grained informational view for local use.
      - name: Duplication gate
        run: composer run duplication

      # Compat first — if these fail the rest of the suite is meaningless.
      - name: Compat lockdown tests
        run: vendor/bin/phpunit --testsuite Compat

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite Unit

      - name: Smoke tests
        run: vendor/bin/phpunit --testsuite Smoke
        # Smoke tests are allowed to be skipped (some need env-gated resources).
        continue-on-error: true

  laravel:
    # Boots the package inside a real Laravel app, one leg per framework major.
    # The PHPUnit matrix above installs no framework at all, so without this
    # job a Laravel release could break the service provider unnoticed.
    name: Laravel ${{ matrix.laravel }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '10'
            php: '8.1'
            testbench: '^8.0'
            # Laravel 10 is past security support: every released version
            # carries an advisory, so Composer's default block leaves nothing
            # installable. This job boots a service provider in a throwaway
            # container and ships nothing, so it opts out — see below.
            allow_advisories: 'true'
          - laravel: '11'
            php: '8.2'
            testbench: '^9.0'
            allow_advisories: 'true'   # same: Laravel 11 is past security support
          - laravel: '12'
            php: '8.3'
            testbench: '^10.0'
          - laravel: '13'
            php: '8.5'
            testbench: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, json, curl
          coverage: none
          tools: composer:v2

      - name: Install dependencies (Laravel ${{ matrix.laravel }})
        run: |
          if [ "${{ matrix.allow_advisories }}" = "true" ]; then
            # Only for the framework majors that no longer receive security
            # patches. Nothing here is shipped or deployed; the alternative is
            # to stop testing the versions this package still claims to
            # support, which is worse than knowing they are EOL.
            composer config --no-plugins policy.advisories.block false
          fi
          composer require --dev --no-update --no-interaction \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-progress --no-interaction

      - name: Laravel integration tests
        run: vendor/bin/phpunit --testsuite Laravel

  integration:
    # Only runs when the workflow is triggered manually or on a release tag.
    # Real vendor endpoints can be flaky / rate-limited, and they cost money.
    # Maintainers run this before cutting a release; PRs don't need it.
    name: Integration (opt-in)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, json, curl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Integration tests
        env:
          SUPERAGENT_INTEGRATION: '1'
          # Provider keys injected as GitHub repo secrets — missing secrets
          # cause the relevant test cases to self-skip, not to fail.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          KIMI_API_KEY:      ${{ secrets.KIMI_API_KEY }}
          QWEN_API_KEY:      ${{ secrets.QWEN_API_KEY }}
          GLM_API_KEY:       ${{ secrets.GLM_API_KEY }}
          MINIMAX_API_KEY:   ${{ secrets.MINIMAX_API_KEY }}
        run: vendor/bin/phpunit --testsuite Integration || true
        # || true so a single vendor outage doesn't fail the whole release;
        # the maintainer reads the summary and decides whether to block.
